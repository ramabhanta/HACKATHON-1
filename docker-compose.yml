version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: agriconnect-postgres
    restart: always
    environment:
      POSTGRES_USER: agriconnect
      POSTGRES_PASSWORD: agri_secret_password_2026
      POSTGRES_DB: agriconnect_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agriconnect-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      JWT_SECRET: agriconnect_super_secret_jwt_key_2026
      DATABASE_URL: postgres://agriconnect:agri_secret_password_2026@postgres:5432/agriconnect_db
      ML_SERVICE_URL: http://ml:8000
      MODEL_PROVIDER: production
    depends_on:
      - postgres
      - ml

  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: agriconnect-ml
    restart: always
    ports:
      - "8000:8000"
    environment:
      MODEL_ARCHITECTURE: mobilenet_v3_large

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agriconnect-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
